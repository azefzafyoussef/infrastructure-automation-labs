# /etc/nagios/nrpe.cfg on each monitored host (active checks via NRPE).
# Only the Nagios server may query this agent:
allowed_hosts=127.0.0.1,192.168.1.10

# Commands the Nagios server can trigger (plugin per metric)
command[check_users]=/usr/lib/nagios/plugins/check_users -w 5 -c 10
command[check_load]=/usr/lib/nagios/plugins/check_load -w 15,10,5 -c 30,25,20
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_mem]=/usr/lib/nagios/plugins/check_mem.pl -w 20 -c 10
