# SquidGuard: block a set of categories, redirect offenders to a local page.
# Blacklists: Université de Toulouse lists, compiled with `squidGuard -C all`.

dbhome /var/lib/squidguard/db
logdir /var/log/squidguard

dest adult {
    domainlist adult/domains
    urllist    adult/urls
}
dest malware {
    domainlist malware/domains
    urllist    malware/urls
}

acl {
    default {
        pass !adult !malware all
        redirect http://127.0.0.1/blocked.htm
    }
}
