# Forward proxy with custom logging, URL filtering (SquidGuard) and Basic auth.

http_port 8080

# --- Access control ---
acl localnet src 192.168.0.0/16
acl SSL_ports port 443
acl Safe_ports port 80 443 21 70 210 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# --- Custom log format (adds User-Agent) ---
logformat custom %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt "%{User-Agent}>h"
access_log /var/log/squid/access.log custom

# --- Basic (NCSA) authentication ---
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/users
auth_param basic realm Proxy
acl authenticated proxy_auth REQUIRED

# --- URL filtering via SquidGuard ---
url_rewrite_program /usr/bin/squidGuard -c /etc/squidguard/squidGuard.conf

http_access allow authenticated localnet
http_access deny all
