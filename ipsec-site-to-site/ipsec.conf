# strongSwan site-to-site VPN between routers R1 and R2.
# Tunnel mode, PSK auth, AES-256 / SHA-256 / DH group 14 (modp2048).
# This is the R1 side; on R2 swap left/right (and leftsubnet/rightsubnet).

config setup
    charondebug="ike 1, knl 1, cfg 0"

conn site-to-site
    keyexchange=ikev2
    authby=secret

    # IKE (phase 1) and ESP (phase 2) proposals
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!

    # R1 (local)
    left=10.0.12.1
    leftsubnet=172.16.1.0/24
    # R2 (remote)
    right=10.0.12.2
    rightsubnet=172.16.2.0/24

    type=tunnel
    auto=start
